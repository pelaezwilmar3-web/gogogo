<div class="content-header">    
    <div class="container-fluid">
        <div class="row mb-2">
            <div class="col-sm-6">
                <h1 class="m-0">Vehiculos</h1>
            </div>
            <div class="col-sm-6">
                <ol class="breadcrumb justify-content-end flex-column align-items-end">
                    <li class="breadcrumb-item active">Vehiculos</li>
                    <li class="breadcrumb-item"><a href="#">Home</a></li>
                </ol>
            </div>
        </div>
    </div>
</div>
<section class="content">
    <div class="container-fluid">
        <hr>
        <button type="button" class="btn btn-warning" (click)="nuevo()">Insertar vehículo</button>
        <div *ngIf="mostrarFormulario" class="row mt-3">
            <div class="col-lg-10">
                <form (ngSubmit)="guardar()" class="row g-2">
                    <div class="col-md-4"><label class="form-label">Serial</label><input class="form-control" name="serial" [(ngModel)]="formulario.serial" required></div>
                    <div class="col-md-2"><label class="form-label">Año</label><input class="form-control" type="number" name="año" [(ngModel)]="formulario['año']" required></div>
                    <div class="col-md-3"><label class="form-label">Color</label><input class="form-control" name="color" [(ngModel)]="formulario.color" required></div>
                    <div class="col-md-3"><label class="form-label">Precio</label><input class="form-control" type="number" name="precio" [(ngModel)]="formulario.precio" required></div>
                    <div class="col-md-3"><label class="form-label">Fecha ingreso</label><input class="form-control" type="date" name="fecha_ingreso" [(ngModel)]="formulario.fecha_ingreso" required></div>
                    <div class="col-md-3"><label class="form-label">Marca</label><select class="form-control" name="fo_marca" [(ngModel)]="formulario.fo_marca" (ngModelChange)="actualizarModelos()" required><option value="">Selecciona una marca</option><option *ngFor="let marca of marcas" [value]="marca.id_marca">{{ marca.nombre }}</option></select></div>
                    <div class="col-md-3"><label class="form-label">Modelo</label><select class="form-control" name="fo_modelo" [(ngModel)]="formulario.fo_modelo" [disabled]="!formulario.fo_marca" required><option value="">Selecciona un modelo</option><option *ngFor="let modelo of modelosDisponibles" [value]="modelo.id_modelo">{{ modelo.nombre }}</option></select></div>
                    <div class="col-12"><button class="btn btn-primary me-2" type="submit">Guardar</button><button class="btn btn-secondary" type="button" (click)="mostrarFormulario = false">Cancelar</button></div>
                </form>
            </div>
        </div>
        <p *ngIf="error" class="text-danger mt-3">{{ error }}</p>
        <hr>
        <div class="table-responsive">
            <table class="table">
                <thead><tr><th>Serial</th><th>Año</th><th>Color</th><th>Precio</th><th>Fecha</th><th>Marca</th><th>Modelo</th><th>Acciones</th></tr></thead>
                <tbody>
                    @for (item of vehiculos(); track item.id_vehiculo) {
                    <tr>
                        <td>{{ item.serial }}</td><td>{{ item['año'] }}</td><td>{{ item.color }}</td><td>{{ item.precio }}</td><td>{{ item.fecha_ingreso }}</td><td>{{ item.marca }}</td><td>{{ item.modelo }}</td>
                        <td><button type="button" class="btn btn-link p-1" (click)="editar(item)" title="Editar"><i class="bi bi-pencil-square text-primary"></i></button><button type="button" class="btn btn-link p-1" (click)="eliminar(item.id_vehiculo)" title="Eliminar"><i class="bi bi-trash text-danger"></i></button></td>
                    </tr>
                    }
                </tbody>
            </table>
        </div>
    </div>
</section>
