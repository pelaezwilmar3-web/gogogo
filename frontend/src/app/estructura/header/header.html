<div class="d-flex justify-content-end mb-4">
  <div class="dropdown">
    <button class="btn btn-link text-decoration-none text-dark" type="button" id="dropdownUser" data-bs-toggle="dropdown" aria-expanded="false">
      <i class="bi bi-person-circle"></i> {{ usuario.nombre || 'Usuario' }}
      <i class="bi bi-chevron-down text-muted"></i>
    </button>

    <ul class="dropdown-menu dropdown-menu-end shadow-sm mt-2" aria-labelledby="dropdownUser">
      <li class="px-3 py-2">
        <div class="fw-semibold">{{ usuario.nombre || 'Usuario' }}</div>
        <small class="text-muted d-block">{{ usuario.email || 'Sin correo' }}</small>
        <small class="text-muted d-block">ID: {{ usuario.id || 'Sin ID' }}</small>
        <small class="text-muted d-block">Rol: {{ usuario.rol || 'Sin rol' }}</small>
      </li>
      <li><a class="dropdown-item" href="#"><i class="bi bi-gear me-2"></i>Configuración</a></li>
      <li><hr class="dropdown-divider"></li>
      <li><a class="dropdown-item text-danger" routerLink="/login" (click)="cerrarSesion()"><i class="bi bi-box-arrow-right me-2"></i>Cerrar sesión</a></li>
    </ul>
  </div>
</div>
